name: migration-drift

# Does every migration file in this repo exist in the HUB's migration history —
# and vice versa?
#
# Ported from mgcj-app 2026-10-01, and this repo needed it more. Hub SQL was
# applied by hand through the SQL editor and never stamped, so the ledger was
# EMPTY while all eight migrations were live. That meant `supabase db push`
# proposed replaying 0001-0008 over the live hub — the database holding the
# invoicing records — and nothing anywhere could have told you a hub migration
# was outstanding. 0001-0008 were verified live and then stamped, which is what
# made this check possible; it would have reported total drift before that.
#
# Read-only. It applies no DDL and parses the ledger only.
#
# ONE project, deliberately: the hub is a single Supabase project shared by
# local, Preview and Production (there is no dev hub), and the two mgcj SPOKE
# projects are covered by mgcj-app's own copy of this check against its own
# migrations. `supabase/migrations/` here is hub schema only.
#
# THIS WORKFLOW NEEDS A SECRET, which is why it is not part of build.yml —
# every job there carries a "NO SECRETS NEEDED" comment and that stays true.
#
# Required repository secret:
#   SUPABASE_ACCESS_TOKEN  — a personal access token from
#                            https://supabase.com/dashboard/account/tokens
# No database password is needed alongside it: the CLI provisions a short-lived
# Postgres role from the token (verified in mgcj-app 2026-09-21 with the OS
# keyring made unreachable, plus a no-token control that failed as expected).
#
# Supabase PATs cannot be scoped to one project or to read-only, so the token is
# ACCOUNT-WIDE and reaches the mgcj projects too. Keep it a REPOSITORY secret,
# not an organization one — and note mgcj-app's copy expires 2027-09-21; if you
# reuse the same token here it lapses here on the same day, and this job then
# goes red with an auth error rather than quietly green.

on:
  # NOT every push, and not pull_request. A feature branch is ALLOWED to carry a
  # migration nobody has applied yet — that is what a branch is for. Gating
  # branches makes this red during ordinary work, and a gate that is red by
  # default gets ignored.
  push:
    branches: [main]
  # Drift can appear or clear with no commit at all — someone applies SQL by
  # hand, or forgets to. The daily run is the only thing that notices that.
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Single source of truth: engines.node in package.json (24.x here, to
          # match Vercel). No `npm ci` — the check imports only node builtins,
          # so installing dependencies would be pure runtime cost.
          node-version-file: package.json

      - uses: supabase/setup-cli@v1
        with:
          # Pinned for the same reason Node is: an unpinned CLI can change its
          # output shape, and this check parses that output.
          version: 2.117.0

      - name: Check migration drift
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not set."
            echo "Add it under Settings -> Secrets and variables -> Actions."
            echo "Failing rather than skipping: a check that silently does nothing"
            echo "is the exact failure mode this workflow was built to catch."
            exit 1
          fi
          npm run check:migrations
