name: secret-scan

# Runs the gitleaks binary directly rather than the marketplace action, which
# requires a GITLEAKS_LICENSE for organization-owned repos. This works the same
# on personal and org repos, today and after any move to a Vellon org.

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # Monday sweep, catches anything pushed without a PR

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — a secret deleted in a later commit is still leaked

      - name: Install gitleaks
        run: |
          set -euo pipefail
          # Extract into RUNNER_TEMP, not /usr/local/bin — the runner user cannot
          # write there without sudo.
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Verify version
        run: gitleaks version

      - name: Scan full history
        run: gitleaks detect --redact --verbose --exit-code 1
